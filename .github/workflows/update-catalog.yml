name: Update Catalog

on:
  push:
    branches: [ main ]
    paths:
      - 'channels.json'
      - 'logos/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Catalog Generator & Purge CDN
        run: |
          python scripts/update_catalog.py --purge

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md logos.json channels.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update catalog, logos.json, and README [skip ci]" && git push)
